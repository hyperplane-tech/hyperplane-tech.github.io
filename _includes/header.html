<header class="site-header">
  <div class="wrap">
    <a class="brand"
      href="{% if page.url == '/' or page.url == '/index.html' %}#top{% else %}{{ '/' | relative_url }}{% endif %}">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect x="0.5" y="0.5" width="25" height="25" rx="7" stroke="currentColor" stroke-opacity="0.22" />
        <path class="mk-accent" d="M4 20L22 6" stroke="#2f4bd8" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="8" cy="8.5" r="2.1" fill="currentColor" />
        <circle cx="14" cy="6" r="1.5" fill="currentColor" fill-opacity="0.5" />
        <circle class="fl-accent" cx="18" cy="18.5" r="2.1" fill="#2f4bd8" />
        <circle class="fl-accent" cx="11.5" cy="20.5" r="1.5" fill="#2f4bd8" fill-opacity="0.5" />
      </svg>
      Hyperplane
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Ouvrir le menu">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
        <path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.8" />
      </svg>
    </button>

    <nav class="nav" id="nav">
      {% if page.url == '/mentions-legales.html' %}
      <a href="{{ '/' | relative_url }}">Retour au site</a>
      {% else %}
      <a href="{{ '/formations.html' | relative_url }}">Formations</a>
      <a
        href="{% if page.url == '/' or page.url == '/index.html' %}#conseil{% else %}{{ '/' | relative_url }}#conseil{% endif %}">Conseil</a>
      <a
        href="{% if page.url == '/' or page.url == '/index.html' %}#approche{% else %}{{ '/' | relative_url }}#approche{% endif %}">Approche</a>
      <a
        href="{% if page.url == '/' or page.url == '/index.html' %}#a-propos{% else %}{{ '/' | relative_url }}#a-propos{% endif %}">À
        propos</a>
      <a class="btn btn-primary"
        href="{% if page.url == '/' or page.url == '/index.html' or page.url == '/formations.html' %}#contact{% else %}{{ '/' | relative_url }}#contact{% endif %}">Nous
        écrire</a>
      {% endif %}
    </nav>
  </div>
</header>
